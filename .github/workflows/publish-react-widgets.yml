name: Publish @repwell/react-widgets

on:
  push:
    tags:
      - "react-widgets-v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-widgets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/react-widgets/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit

  publish:
    name: Publish to NPM
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/react-widgets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/react-widgets/package-lock.json
      - run: npm ci
      - run: npx tsup
      - name: Verify bundle size
        run: |
          SIZE=$(gzip -c dist/index.js | wc -c)
          echo "Bundle size (gzipped): ${SIZE} bytes"
          if [ "$SIZE" -gt 51200 ]; then
            echo "ERROR: Bundle exceeds 50KB gzipped limit"
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
