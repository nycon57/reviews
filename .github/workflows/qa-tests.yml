name: QA Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint + Type Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
          BETTER_AUTH_SECRET: mock-ci-secret-not-used-at-runtime

  smoke-public:
    name: Smoke Tests (Public)
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=smoke-public
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-public-report
          path: playwright-report/

  smoke-dashboard:
    name: Smoke Tests (Dashboard)
    needs: lint-and-build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed test users
        run: npm run seed:test-users
      - run: npx playwright test --project=auth-setup --project=smoke-dashboard-individual --project=smoke-dashboard-enterprise --project=access-control
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-dashboard-report
          path: playwright-report/

  widget-tests:
    name: Widget Tests
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=widgets
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: widget-test-report
          path: playwright-report/
