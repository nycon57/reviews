name: Widget E2E Tests & Performance Benchmarks

on:
  pull_request:
    paths:
      - "src/embed/**"
      - "src/lib/widgets/**"
      - "src/components/widgets/**"
      - "src/app/api/v1/widgets/**"
      - "tests/e2e/widgets/**"
      - "tests/performance/**"
      - "playwright.config.ts"
      - "scripts/build-embed.ts"
  push:
    branches: [main]
    paths:
      - "src/embed/**"
      - "src/lib/widgets/**"
      - "tests/e2e/widgets/**"
      - "tests/performance/**"

jobs:
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build embed.js
        run: npx tsx scripts/build-embed.ts

      - name: Run bundle size assertion
        run: npx vitest run --config vitest.performance.config.ts

  unit-tests:
    name: Widget Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build embed.js
        run: npx tsx scripts/build-embed.ts

      - name: Run widget unit tests
        run: npx vitest run src/embed/__tests__/ src/lib/widgets/__tests__/

  e2e-tests:
    name: Widget E2E Tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
      SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
      DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
      BETTER_AUTH_SECRET: mock-ci-secret-not-used-at-runtime
    needs: [bundle-size, unit-tests]
    # Pre-dates the golden-flows E2E workstream; needs real env to be trustworthy.
    # Non-blocking until replaced (docs/plans/2026-07-06-feature-audit-campaign.md §6k.2).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build embed.js
        run: npx tsx scripts/build-embed.ts

      - name: Build Next.js app
        run: npm run build

      - name: Run E2E widget tests
        run: npx playwright test tests/e2e/widgets/
        env:
          CI: "true"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
      SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
      DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
      BETTER_AUTH_SECRET: mock-ci-secret-not-used-at-runtime
    needs: [bundle-size, unit-tests]
    # Non-blocking until golden-flows replacement (see e2e-tests note).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build embed.js
        run: npx tsx scripts/build-embed.ts

      - name: Build Next.js app
        run: npm run build

      - name: Run render timing benchmarks
        run: npx playwright test tests/performance/render-timing.test.ts

      - name: Run CLS measurement
        run: npx playwright test tests/performance/cls-measurement.test.ts

      - name: Run memory profiling
        run: npx playwright test tests/performance/memory-profiling.test.ts

      - name: Run Lighthouse impact test
        run: npx playwright test tests/performance/lighthouse-widget.test.ts

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
